<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<title>notification toast</title><link rel="stylesheet" href="assets/base.css" /><script src="assets/gsap.min.js"></script><script src="cue.js"></script><script src="assets/boot.js"></script>
<style>#w{position:absolute;width:940px;perspective:1600px}
.toast{display:flex;gap:26px;align-items:flex-start;padding:30px 34px;border-radius:44px;background:rgba(246,246,248,.95);backdrop-filter:blur(30px)}
.ic{flex:0 0 96px;height:96px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.ic img{max-width:78px;max-height:78px}.row{display:flex;justify-content:space-between;gap:20px}.ti{font-weight:600;font-size:32px;color:#000}.tm{font-size:26px;color:#8a8a8e}
.tx{margin-top:4px;font-size:31px;line-height:1.3;color:#1c1c1e}#stamp{position:absolute;left:18px;top:-76px;height:64px;padding:0 26px;border-radius:32px;background:var(--accent);color:var(--dark);display:flex;align-items:center;font:800 30px/1 var(--font-head);letter-spacing:.02em;opacity:0}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-fps="30" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0">
<div id="w"><div id="card" class="toast shadow"><div class="ic"><img id="icon" /></div><div style="flex:1;min-width:0"><div class="row"><span class="ti" id="ti"></span><span class="tm" id="tm"></span></div><div class="tx" id="tx"></div></div></div><div id="stamp"></div></div>
</div></div>
<script src="assets/mg.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
const D = __DUR__, IN = T("in", 0.0), OUT = D - T("out_s", 0.35);
const w=document.getElementById("w"); place(w,{x:70,y:300});
document.getElementById("icon").src=T("icon","assets/logo.png"); ti.textContent=T("title",""); tm.textContent=T("time","now"); tx.textContent=T("text","");
const st=T("stamp",null); if(st) stamp.textContent=st;
const LAND=IN+0.3;
tl.fromTo("#card",{y:-420,rotationX:-28,scale:.94},{y:0,rotationX:0,scale:1,duration:0.3,ease:"power3.in"},IN);
tl.to("#card",{keyframes:[{y:12,duration:2/30},{y:-5,duration:5/30},{y:0,duration:6/30}]},LAND);
if(MG.shake) MG.shake(tl,"#w",LAND,{amp:6,frames:6,seed:2});
if(st){tl.fromTo("#stamp",{scale:2.3,rotation:-12,opacity:0},{scale:1,rotation:-4,opacity:1,duration:0.14,ease:"power3.in"},T("stamp_t",1.2)); if(MG.shake) MG.shake(tl,"#w",T("stamp_t",1.2)+0.14,{amp:8,frames:6,seed:5});}
tl.to(["#card","#stamp"],{y:-520,opacity:0,duration:0.26,ease:"power3.in"},OUT);
window.__timelines["main"] = tl;
</script></body></html>
